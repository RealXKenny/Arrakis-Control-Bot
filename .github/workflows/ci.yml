name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev

  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4

      - name: Name image
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build container image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$GITHUB_SHA" .

      - name: Check runtime image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm --entrypoint node "$IMAGE:latest" -e '
            const fs = require("node:fs");
            require("canvas");
            for (const path of ["dist/src/index.js", "data/images/panel-welcome.png"]) {
              if (!fs.existsSync(path)) throw new Error(`Missing runtime file: ${path}`);
            }
          '

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish container image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push --all-tags "$IMAGE"
