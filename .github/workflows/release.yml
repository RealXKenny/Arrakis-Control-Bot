name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Only CI runs for main start this workflow, so pull request CI never queues a skipped release run.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # Defence in depth beyond the job condition: never tag, publish an image, or run
      # `gh release create` for a commit that is not already on main in this repository.
      - name: Confirm the release commit is on main
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          test "$HEAD_EVENT" = push || { echo "Releases run only after a push to main (got $HEAD_EVENT)." >&2; exit 1; }
          test "$HEAD_BRANCH" = main || { echo "Releases run only from main (got $HEAD_BRANCH)." >&2; exit 1; }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$HEAD_SHA" refs/remotes/origin/main || {
            echo "Commit $HEAD_SHA is not on main; refusing to release." >&2
            exit 1
          }

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          current_version=$(node -p "require('./package.json').version")
          tag="v$current_version"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_tag=$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname | head -n 1)
          previous_version=${previous_tag#v}

          VERSION="$current_version" PREVIOUS_VERSION="$previous_version" node <<'NODE'
          const stableSemver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          const current = stableSemver.exec(process.env.VERSION);

          if (!current) {
            throw new Error("Releases require stable semantic versions such as 1.2.3.");
          }

          if (!process.env.PREVIOUS_VERSION) process.exit(0);
          const previous = stableSemver.exec(process.env.PREVIOUS_VERSION);

          if (!previous) {
            throw new Error(`Latest version tag is invalid: v${process.env.PREVIOUS_VERSION}`);
          }

          const compare = [1, 2, 3]
            .map((index) => Number(current[index]) - Number(previous[index]))
            .find((difference) => difference !== 0) ?? 0;

          if (compare <= 0) {
            throw new Error(`Package version must increase (${process.env.PREVIOUS_VERSION} -> ${process.env.VERSION}).`);
          }
          NODE

          notes_file="$RUNNER_TEMP/$tag-notes.md"
          awk -v heading="## [$current_version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$notes_file" || {
            echo "CHANGELOG.md must contain a '## [$current_version]' section." >&2
            exit 1
          }

          if ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "The [$current_version] section in CHANGELOG.md is empty." >&2
            exit 1
          fi

          echo "create=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Name image
        if: steps.release.outputs.create == 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.release.outputs.create == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build versioned image
        if: steps.release.outputs.create == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          cache-from: type=gha,scope=arrakis-bot-release
          cache-to: type=gha,mode=max,scope=arrakis-bot-release
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.tag }}
            ${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha }}

      - name: Check runtime image
        if: steps.release.outputs.create == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm --workdir /opt/arrakis --entrypoint node "$IMAGE:latest" -e '
            const fs = require("node:fs");
            require("canvas");
            for (const path of ["dist/src/index.js", "data/images/panel-welcome.png", "certificates/production-rabbitmq-server.pem", "certificates/development-rabbitmq-server.pem"]) {
              if (!fs.existsSync(path)) throw new Error(`Missing runtime file: ${path}`);
            }
            const { X509Certificate } = require("node:crypto");
            for (const name of ["production", "development"]) {
              new X509Certificate(fs.readFileSync(`certificates/${name}-rabbitmq-server.pem`));
            }
          '
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.description" }}' "$IMAGE:latest")" = 'Discord bot for Dune: Awakening communities with moderation, server operations, music, and integrations.'

      - name: Check Pterodactyl startup contract
        if: steps.release.outputs.create == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run --rm --entrypoint sh "$IMAGE:latest" -c '
            test "$(id -un)" = container &&
            test "$HOME" = /home/container &&
            test "$PWD" = /home/container &&
            test -f /opt/arrakis/dist/src/index.js
          '
          test "$(docker run --rm -e STARTUP='printf pterodactyl-ready' "$IMAGE:latest")" = pterodactyl-ready

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish versioned image
        if: steps.release.outputs.create == 'true'
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push --all-tags "$IMAGE"

      - name: Create GitHub release
        if: steps.release.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes_file }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          gh release create "$RELEASE_TAG"
          --target "$RELEASE_SHA"
          --title "Arrakis Control Bot $RELEASE_VERSION"
          --notes-file "$RELEASE_NOTES"
